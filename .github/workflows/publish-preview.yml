name: Publish checked preview

# One-time publication of the startup correction.
# Return to manual-only operation after verification.
# Existing release tags are never overwritten.
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-preview.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-v0.1.3-preview
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'zach-hopkins/bg-pathfinding-redux'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install LuaJIT for portable fixture checks
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Check the accepted source and download pinned WeiDU inputs
        run: |
          python tools/checks.py --lua luajit
          python tools/fetch_vendor.py
      - name: Build and verify the Windows installer package
        run: python tools/build_release.py --vendor-dir .vendor
      - name: Require the exact reviewed payload manifest
        run: |
          python - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          archive = Path('dist/bg-redux-movement-0.1.3-preview-windows.zip')
          with zipfile.ZipFile(archive) as z:
              actual = hashlib.sha256(z.read('manifest.json')).hexdigest()
              expected = '8b3474e5e66b500afd17732dee60723562a4fc240f2609518153461cb8951ad0'
              assert actual == expected, 'Package payload differs from the reviewed release'
          PY
      - name: Create a draft with both assets, then publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.1.3-preview \
            dist/bg-redux-movement-0.1.3-preview-windows.zip \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "BG Pathfinding Redux 0.1.3-preview" \
            --notes-file docs/RELEASE_NOTES.md \
            --prerelease --draft
          gh release edit v0.1.3-preview --draft=false
